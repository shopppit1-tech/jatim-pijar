name: Buat narasi dan ilustrasi AI harian

on:
  workflow_dispatch:
  schedule:
    # 01:00 UTC = 08:00 WIB. Hanya satu jadwal harian.
    - cron: "0 1 * * *"

permissions:
  contents: write
  actions: read

concurrency:
  group: generate-daily-editorial
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Request at most one new item from Render
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/request_render_generation.py
      - name: Save daily limit and generated content
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generation_state.json generated_content.json assets/generated
          if git diff --cached --quiet; then
            echo "No generated-content changes"
          else
            git commit -m "Generate daily AI editorial draft"
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin main; then
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              sleep "$((attempt * 2))"
            done
            echo "Could not push the daily-limit state to main after retries." >&2
            exit 1
          fi
